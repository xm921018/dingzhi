name: relay

on:
  schedule:
    - cron: '23 14 * * *'      # UTC 14:23 ≈ 北京 22:23，错峰
  workflow_dispatch: {}

jobs:
  plan:
    # 动态扩片：按号池实际人数算出需要的并行片数，人数涨片数自动涨，无需改代码
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
      ns: ${{ steps.plan.outputs.ns }}
    steps:
      - name: plan slices
        id: plan
        env:
          NB_POOL_1: ${{ secrets.NB_POOL_1 }}
          NB_POOL_2: ${{ secrets.NB_POOL_2 }}
          NB_POOL_3: ${{ secrets.NB_POOL_3 }}
          NB_POOL_4: ${{ secrets.NB_POOL_4 }}
          NB_POOL_5: ${{ secrets.NB_POOL_5 }}
          MIN_SLICES: '4'
          MAX_SLICES: '160'  # 2026-10-20：原 40 片 × 6 号 = 240 号封顶，号池超过 240 就会漏号不播。
                             # 提到 160 片（=960 号位），超过 GitHub 并发（20）的部分排队跑，不会报错也不会漏号。
          ACCOUNTS_PER_SLICE: '6'   # 2026-10-20：改为「每个号独立线程并行」后，单号 85-95 分钟不再叠加。
                                    # 6 个/片 ≈ 1.6h（并行），片数按号池自动算，一轮基本能跑完。
        run: |
          python3 - <<'EOF'
          import base64, json, os, math
          n = 0
          for i in range(1, 6):
              raw = os.environ.get(f"NB_POOL_{i}")
              if not raw:
                  continue
              try:
                  chunk = json.loads(base64.b64decode(raw).decode("utf-8"))
                  if isinstance(chunk, list):
                      n += len(chunk)
              except Exception:
                  pass
          per = int(os.environ.get("ACCOUNTS_PER_SLICE", "8"))
          lo = int(os.environ.get("MIN_SLICES", "4"))
          hi = int(os.environ.get("MAX_SLICES", "30"))
          ns = max(lo, min(hi, math.ceil(n / per) if n else lo))
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write(f"ns={ns}\n")
              f.write(f"matrix={json.dumps({'slice': list(range(ns))})}\n")
          print(f"pool_size={n} ns={ns}")
          EOF

  brush:
    needs: plan
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.plan.outputs.matrix) }}
    env:
      NS: ${{ needs.plan.outputs.ns }}
      SLICE: ${{ matrix.slice }}
      NB_PASS: ${{ secrets.NB_PASS }}
      # 跨群互听：只拉对端群的歌曲 id 列表，两个群的 KV 号池/人数/上限仍然完全独立
      PEER_WORKER_URL: 'https://xx1031.xyz'
      # 跨群鉴权复用本群群口令 NB_PASS（对端 KV 的 PEER_PASS 存的是本群口令，无需新建 Secret）
      ACCOUNT_PARALLEL: '6'   # 每个号一个线程并行播放（单号大部分时间在等播放时长，不占 CPU）
      NB_POOL_1: ${{ secrets.NB_POOL_1 }}
      NB_POOL_2: ${{ secrets.NB_POOL_2 }}
      NB_POOL_3: ${{ secrets.NB_POOL_3 }}
      NB_POOL_4: ${{ secrets.NB_POOL_4 }}
      NB_POOL_5: ${{ secrets.NB_POOL_5 }}
      EMAIL_FROM: ${{ secrets.EMAIL_FROM }}
      EMAIL_AUTH_CODE: ${{ secrets.EMAIL_AUTH_CODE }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -q pycryptodome requests pillow
      - name: install CJK fonts (notes.py 笔记图片中文字体，2026-10-13 修复：runner 无中文字体时图片文字全是方块)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y fonts-arphic-uming fonts-noto-cjk
      - name: stagger start
        run: sleep $((RANDOM % 240 + 60))   # 错开各片启动，避免同刻批量特征
      - name: run slice
        run: python run.py
      - name: build accounts for signin/notes
        run: python make_accounts.py
      - name: daily signin
        run: |
          N=$(python -c "import json;print(len(json.load(open('accounts.json'))['accounts']))")
          if [ "$N" -gt 0 ]; then python signin.py; else echo "本片无账号，跳过签到"; fi
      - name: notes publish (per-account every 6 days)
        run: |
          N=$(python -c "import json;print(len(json.load(open('accounts.json'))['accounts']))")
          if [ "$N" -gt 0 ]; then python notes.py; else echo "本片无账号，跳过笔记"; fi
      - name: upload diag
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diag-slice-${{ matrix.slice }}
          path: diag_logs/
          if-no-files-found: ignore
